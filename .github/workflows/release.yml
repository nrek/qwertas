name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create or update a GitHub Release from this run"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            dist: dist:win
            artifact: windows
          - platform: macos
            os: macos-latest
            dist: dist:mac
            artifact: macos
          - platform: linux
            os: ubuntu-latest
            dist: dist:linux
            artifact: linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Keep electron-builder from auto-publishing; the publish job owns Releases.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ${{ matrix.dist }}

      - name: Stage release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged
          shopt -s nullglob
          for path in release/QWERTAS-*; do
            base="$(basename "$path")"
            case "$base" in
              *.exe|*.zip|*.dmg|*.AppImage|*.deb)
                cp -a "$path" "staged/$base"
                ;;
            esac
          done
          ls -la staged
          test "$(find staged -type f | wc -l)" -gt 0

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qwertas-${{ matrix.artifact }}
          path: staged/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: qwertas-*
          merge-multiple: true

      - name: Prepare release files and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          find artifacts -type f -print0 | while IFS= read -r -d '' file; do
            cp -a "$file" "dist-release/$(basename "$file")"
          done
          cd dist-release
          ls -la
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          test "$(find . -type f ! -name SHA256SUMS.txt | wc -l)" -ge 6

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            version="$(node -p "require('./package.json').version")"
            echo "name=v${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: QWERTAS ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Free desktop builds of QWERTAS for Windows, macOS, and Linux.

            **Unsigned / unnotarized.** Windows SmartScreen and macOS Gatekeeper warnings are expected. Do not disable OS security controls as a routine install step.

            Installers are also linked from https://qwertas.nrek.co/downloads/

            SHA-256 digests are in `SHA256SUMS.txt`.
          files: |
            dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}